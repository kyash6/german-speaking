<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1730">
<title>German Speaking Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1730;--navy2:#13264d;--ink:#0a1226;--gold:#ffc83d;--gold2:#e89b0c;--cream:#fff8e8;--muted:#9fb3d9;--tc:#2f9bff;--tc2:#1565c0;--ok:#2ecc71;--ok2:#1e9e52;--red:#ff4b5c;--red2:#c4202f}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--navy)}
body{min-height:100vh;color:#fff;font:16px/1.5 "Nunito",-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background:radial-gradient(1200px 600px at 50% -10%,#2a4f9a 0,transparent 60%),radial-gradient(800px 500px at 100% 100%,#3a1f6b 0,transparent 60%),linear-gradient(180deg,#14295a,var(--navy) 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:22px 22px}
.flag{height:5px;background:linear-gradient(90deg,#000 0 33.3%,#dd0000 33.3% 66.6%,#ffce00 66.6%);position:relative;z-index:1}
.game{font-family:"Lilita One","Nunito",sans-serif;font-weight:400;letter-spacing:.01em}
header{max-width:960px;margin:0 auto;padding:20px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
h1{font-family:"Lilita One",sans-serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1;color:var(--gold);text-shadow:0 3px 0 #8a4b00,0 6px 14px rgba(0,0,0,.5);-webkit-text-stroke:1px #6b3a00}
h1 small{display:block;font-family:"Nunito",sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);-webkit-text-stroke:0;text-shadow:none;margin-top:6px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px;position:relative}
select{appearance:none;-webkit-appearance:none;border:3px solid var(--ink);background:linear-gradient(#24407a,#182d58);color:#fff;border-radius:12px;padding:8px 30px 8px 12px;font:800 .8rem "Nunito",sans-serif;max-width:200px;box-shadow:0 4px 0 var(--ink);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%),linear-gradient(#24407a,#182d58);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%,0 0;background-size:5px 5px,5px 5px,100% 100%;background-repeat:no-repeat}
.chips{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 16px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:3px solid var(--ink);background:linear-gradient(#2b4a8a,#1b3266);color:#dfe8ff;border-radius:14px;padding:7px 16px;font:400 .95rem "Lilita One",sans-serif;letter-spacing:.02em;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.18);transition:transform .1s,box-shadow .1s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.on{background:linear-gradient(#ffd866,var(--gold2));color:#4a2600;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;font:400 1rem "Lilita One",sans-serif;color:#fff;text-shadow:0 2px 0 var(--ink)}
.prog{flex:1;height:18px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#0a1530;box-shadow:inset 0 3px 4px rgba(0,0,0,.5)}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(#7dffb0,var(--ok) 50%,var(--ok2) 51%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#known{background:var(--ink);padding:2px 10px;border-radius:10px;color:var(--gold)}
.scene{perspective:1600px;cursor:pointer;-webkit-tap-highlight-color:transparent;max-width:720px;margin:0 auto}
.card{position:relative;min-height:min(60vh,460px);transition:transform .6s cubic-bezier(.4,1.5,.5,1);transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.scene:hover .card:not(.flip){transform:translateY(-3px) rotateX(2deg)}
.face{position:absolute;inset:0;border:4px solid var(--ink);border-radius:26px;padding:20px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
box-shadow:0 10px 0 var(--ink),0 24px 40px rgba(0,0,0,.45)}
.front{background:radial-gradient(120% 80% at 50% 0,rgba(255,255,255,.28),transparent 60%),linear-gradient(160deg,var(--tc),var(--tc2))}
.front::before{content:"";position:absolute;inset:8px;border-radius:18px;border:3px solid rgba(255,255,255,.35);pointer-events:none}
.front::after{content:"?";position:absolute;right:-10px;bottom:-60px;font:400 15rem/1 "Lilita One",sans-serif;color:rgba(0,0,0,.12);pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(var(--cream),#f3e6c4);color:var(--ink);overflow:auto}
.back::before{content:"";position:absolute;inset:8px;border-radius:18px;border:3px dashed rgba(10,18,38,.15);pointer-events:none}
.tag{position:relative;z-index:1;align-self:center;display:inline-block;font:400 .95rem "Lilita One",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ink);padding:6px 18px 5px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35);text-shadow:none}
.back .tag{background:var(--tc2)}
.q{position:relative;z-index:1;font:400 clamp(1.6rem,5vw,2.5rem)/1.15 "Lilita One",sans-serif;text-align:center;margin:auto 6px 12px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 2px rgba(0,0,0,.4);-webkit-text-stroke:.5px rgba(0,0,0,.25)}
.en{position:relative;z-index:1;text-align:center;font-weight:700;font-size:1rem;color:rgba(255,255,255,.85);margin:0 auto auto;max-width:90%;background:rgba(0,0,0,.18);padding:6px 14px;border-radius:12px}
.a{position:relative;z-index:1;font-weight:700;font-size:clamp(1.15rem,3.4vw,1.55rem);line-height:1.6;margin:auto 4px;color:#1a2440}
.a .w{border-radius:5px;padding:0 1px;transition:background .12s,color .12s}
.a .w.hl{background:var(--gold);color:#3a1d00;box-shadow:0 2px 0 var(--gold2)}
.small{position:relative;z-index:1;font-size:.85rem;font-weight:800;color:#7a6a45;margin-top:14px;padding-top:10px;border-top:2px dashed rgba(10,18,38,.15)}
.hint{text-align:center;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:26px}
.ctrls,.row2{display:grid;gap:12px;max-width:720px;margin:14px auto 0}
.ctrls{grid-template-columns:1fr 1.3fr 1fr}
.row2{grid-template-columns:repeat(4,1fr)}
.btn{--b:#3a62b0;--b2:#24427f;border:3px solid var(--ink);background:linear-gradient(var(--b),var(--b2));color:#fff;border-radius:16px;padding:14px 8px 12px;font:400 1.1rem "Lilita One",sans-serif;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.35);
box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25)}
.btn.speak{--b:#ff6b78;--b2:var(--red2);font-size:1.25rem}
.btn.known{--b:#4fe08a;--b2:var(--ok2)}
.row2 .btn{font-size:.9rem;padding:10px 4px 9px;border-radius:14px}
.btn.on{--b:#ffd866;--b2:var(--gold2);color:#4a2600;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.speed{display:flex;align-items:center;gap:12px;max-width:720px;margin:22px auto 0;padding:12px 16px;background:rgba(0,0,0,.25);border:3px solid var(--ink);border-radius:16px;font:400 1rem "Lilita One",sans-serif}
.speed input{flex:1;-webkit-appearance:none;appearance:none;height:12px;border-radius:99px;background:#0a1530;border:2px solid var(--ink);outline:none}
.speed input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(#ffd866,var(--gold2));border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.speed input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);cursor:pointer}
#rateV{min-width:3.4em;text-align:right;color:var(--gold)}
.list{display:none;gap:16px;flex-direction:column;max-width:760px;margin:0 auto}
.list.show{display:flex}
.list>.btn{align-self:flex-start;padding:10px 18px}
.li{position:relative;background:linear-gradient(var(--cream),#f3e6c4);color:var(--ink);border:4px solid var(--ink);border-left:12px solid var(--tc);border-radius:20px;padding:16px 18px;box-shadow:0 6px 0 var(--ink)}
.li h3{font:400 1.2rem/1.25 "Lilita One",sans-serif;margin:10px 0 2px}
.li p{font-weight:700;font-size:1rem;color:#1a2440}
.li .en{font-size:.85rem;margin:0 0 8px;padding:0;background:none;color:#7a6a45;text-align:left;max-width:none}
.li .row{display:flex;justify-content:space-between;align-items:center}
.li .tag{align-self:auto;background:var(--tc2);font-size:.75rem;padding:4px 12px}
.mini{border:3px solid var(--ink);background:linear-gradient(#3a62b0,#24427f);color:#fff;border-radius:10px;padding:5px 12px;font:400 .85rem "Lilita One",sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.done{font:400 1.3rem "Lilita One",sans-serif;color:#fff;background:var(--ok);border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.card.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@media (max-width:480px){.row2{grid-template-columns:1fr 1fr}.face{padding:16px}.ctrls .btn{font-size:1rem}}
@media (min-width:1024px){.card{min-height:480px}}
</style>
</head>
<body>
<div class="flag"></div>
<header>
  <h1>🇩🇪 Deutsch Speaking<small>Edexcel IGCSE 4GN1 · oral prep cards</small></h1>
  <select id="voice" aria-label="Voice"></select>
</header>
<div class="wrap">
  <div class="chips" id="chips"></div>
  <div class="bar"><span id="count"></span><div class="prog"><i id="prog"></i></div><span id="known"></span></div>

  <div id="study">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front">
          <span class="tag" id="ftag"></span>
          <div class="q" id="fq"></div>
          <div class="en" id="fen"></div>
        </div>
        <div class="face back">
          <span class="tag" id="btag"></span>
          <div class="a" id="ba"></div>
          <div class="small" id="bq"></div>
        </div>
      </div>
    </div>
    <div class="hint">Tap card to flip · Keys: ← → space S</div>
    <div class="ctrls">
      <button class="btn" id="prev">← Back</button>
      <button class="btn speak" id="say">🔊 Hören</button>
      <button class="btn" id="next">Next →</button>
    </div>
    <div class="row2">
      <button class="btn known" id="mark">✓ Got it</button>
      <button class="btn" id="shuffle">🔀 Shuffle</button>
      <button class="btn" id="todo">Unlearnt</button>
      <button class="btn" id="listBtn">☰ List</button>
    </div>
    <div class="speed">🐢<input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.85">🐇<span id="rateV">0.85×</span></div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const D=[
["A2 Holidays","Wohin fährst du gern in Urlaub und warum?","Where do you like to go on holiday and why?","Ich fahre am liebsten nach Spanien in Urlaub, weil das Essen dort am besten ist. Außerdem hat Spanien sehr schöne Strände, und das Meer ist noch besser!"],
["A2 Holidays","Beschreibe deinen letzten Urlaub.","Describe your last holiday.","Letzten Sommer bin ich mit meinen Freunden nach Griechenland geflogen. Als wir in Griechenland waren, sind wir in Museen gegangen und haben Monumente besichtigt. Der Urlaub war interessant, aber das Essen war nicht so gut."],
["A2 Holidays","Was sind deine Reisepläne in den nächsten Ferien?","What are your travel plans for the next holidays?","Nächstes Jahr im Winter werde ich mit meiner Familie nach Italien fahren. Das Essen dort ist sehr lecker und italienisches Essen ist mein Lieblingsessen. Wir wollen Ski fahren, aber es ist so teuer!"],
["A2 Holidays","Was ist dein Traumreiseziel? Warum?","What is your dream travel destination? Why?","Mein Traumreiseziel ist die Antarktis, weil ich das kalte Klima liebe. Jedoch ist es sehr teuer, dorthin zu reisen, und das Essen ist wahrscheinlich schrecklich."],
["A2 Holidays","Ist es besser, einen Urlaub mit der Familie oder mit Freunden zu verbringen?","Is it better to spend a holiday with family or with friends?","Ich verbringe meinen Urlaub lieber mit Freunden, weil es viel Spaß macht. Wir können zusammen neue Orte besuchen und viele Fotos machen."],
["A2 Holidays","Was ist dir wichtig beim Reisen: Entspannung, Kultur, spannende Erlebnisse?","What is important to you when travelling: relaxation, culture, exciting experiences?","Für mich ist Entspannung beim Reisen am wichtigsten, weil ich mich ausruhen möchte. Ich finde Kultur auch interessant, aber ich möchte keinen Stress haben."],
["A5 Traditions","Welche Feste und Feiertage gibt es in deinem Land?","What festivals and holidays are there in your country?","In meinem Land gibt es Weihnachten, Neujahr und den Nationalfeiertag. Ich mag diese Feste, weil die ganze Familie zusammenkommt."],
["A5 Traditions","Wie wirst du das nächste Fest feiern?","How will you celebrate the next festival?","Ich werde das nächste Fest mit meiner Familie feiern, weil wir gerne zusammen essen. Wir werden auch Musik hören und viel Spaß haben."],
["A5 Traditions","Welches Fest findest du am interessantesten und warum?","Which festival do you find most interesting and why?","Ich finde Weihnachten am interessantesten, weil ich viele Geschenke bekomme. Außerdem verbringe ich gerne Zeit mit meiner Familie."],
["A5 Traditions","Inwiefern sind traditionelle Feste wichtig für Jugendliche?","To what extent are traditional festivals important for young people?","Traditionelle Feste sind für Jugendliche wichtig, weil sie mehr über ihre Kultur lernen können. Außerdem können sie Zeit mit ihrer Familie verbringen."],
["B1 School","Welche Fächer lernst du am liebsten und warum?","Which subjects do you like learning most and why?","Ich lerne Sport und Wirtschaft am liebsten, weil sie interessant sind. Außerdem finde ich diese Fächer nützlich für die Zukunft."],
["B1 School","Wie war deine letzte Schulwoche? Was hast du gemacht? Wie war es?","How was your last school week? What did you do? How was it?","Letzte Woche hatte ich viele Prüfungen, aber ich hatte auch Spaß mit meinen Freunden. Die Woche war ziemlich stressig, weil ich viel lernen musste."],
["B1 School","Welche sind die wichtigsten Schulfächer, meinst du?","Which are the most important school subjects, in your opinion?","Ich denke, Mathematik und Englisch sind sehr wichtige Fächer, weil sie im Leben nützlich sind. Außerdem braucht man diese Fächer für viele Berufe."],
["B1 School","Wie könnte man den Schultag verbessern?","How could the school day be improved?","Man könnte den Schultag kürzer machen, weil die Schüler dann weniger müde wären. Außerdem könnte es längere Pausen geben."],
["B1 School","Welche Fächer wirst du nächstes Jahr im IB-Programm wählen? Warum?","Which subjects will you choose next year in the IB? Why?","Nächstes Jahr werde ich Wirtschaft, Sport und Deutsch wählen, weil ich diese Fächer interessant finde. Außerdem möchte ich Wirtschaft später studieren."],
["B5 Future","Was für Pläne hast du für das nächste Schuljahr?","What plans do you have for next school year?","Nächstes Schuljahr möchte ich gute Noten bekommen, weil sie für meine Zukunft wichtig sind. Außerdem möchte ich mehr Zeit mit meinen Freunden verbringen."],
["B5 Future","Welche Möglichkeiten gibt es nach der Schule? Welche sind für dich ideal?","What options are there after school? Which are ideal for you?","Nach der Schule kann man studieren oder arbeiten, aber ich möchte studieren. Das ist für mich ideal, weil ich einen guten Beruf haben möchte."],
["B5 Future","Würdest du ein Pausenjahr machen oder sofort mit dem Studium anfangen? Warum?","Would you take a gap year or start university straight away? Why?","Ich würde sofort mit dem Studium anfangen, weil ich keine Zeit verlieren möchte. Außerdem möchte ich schnell einen guten Beruf finden."],
["B5 Future","Was hat deine Schule organisiert, um euch mit der Berufswahl zu helfen?","What has your school organised to help you choose a career?","Meine Schule hat Präsentationen und Beratung organisiert, weil wir Hilfe bei der Berufswahl brauchen. Wir können auch Informationen im Internet finden."],
["B5 Future","Welche Zukunftspläne hast du nach der Uni?","What future plans do you have after university?","Nach der Uni möchte ich einen guten Job finden, weil ich erfolgreich sein möchte. Außerdem möchte ich viel reisen und neue Länder sehen."],
["C1 Home","Beschreib bitte dein Haus oder deine Wohnung.","Please describe your house or flat.","Mein Haus ist ziemlich groß und hat einen schönen Garten. Ich mag mein Haus, weil es ruhig und gemütlich ist."],
["C1 Home","Welche Änderungen hat deine Familie im Haus gemacht?","What changes has your family made to the house?","Meine Familie hat die Küche renoviert, weil sie alt war. Außerdem haben wir neue Möbel gekauft."],
["C1 Home","Wie hast du dein Zimmer gemütlicher gemacht?","How have you made your room cosier?","Ich habe neue Lampen und Bilder für mein Zimmer gekauft, weil es gemütlicher sein sollte. Außerdem halte ich mein Zimmer sauber."],
["C1 Home","Wenn du älter bist, in was für einem Haus wirst du wohnen?","When you are older, what kind of house will you live in?","Wenn ich älter bin, möchte ich in einem großen Haus mit einem Garten wohnen. Ich möchte dort wohnen, weil ich viel Platz haben möchte."],
["C1 Home","Warum wohnen manche Leute lieber in einer Wohnung als in einem Haus?","Why do some people prefer living in a flat rather than a house?","Manche Leute wohnen lieber in einer Wohnung, weil sie weniger Arbeit macht. Außerdem ist eine Wohnung oft billiger als ein Haus."],
["C2 Routine","Kannst du deine tägliche Morgenroutine beschreiben?","Can you describe your daily morning routine?","Morgens stehe ich um sieben Uhr auf und dusche, bevor ich frühstücke. Danach ziehe ich mich an und gehe zur Schule."],
["C2 Routine","Wie sieht dein typischer Schultag aus?","What does your typical school day look like?","Mein Schultag beginnt um acht Uhr und ich habe viele verschiedene Fächer. Nach der Schule mache ich meine Hausaufgaben, weil sie wichtig sind."],
["C2 Routine","Wie sieht dein typischer Sonntag aus?","What does your typical Sunday look like?","Sonntags schlafe ich lange und frühstücke mit meiner Familie. Danach treffe ich meine Freunde, weil ich am Wochenende gerne entspanne."],
["C2 Routine","Hilfst du zu Hause? Was machst du?","Do you help at home? What do you do?","Ja, ich helfe zu Hause und ich räume mein Zimmer auf. Außerdem spüle ich manchmal das Geschirr, weil meine Familie viel zu tun hat."],
["C2 Routine","Wie hast du neulich mit der Hausarbeit geholfen?","How did you recently help with the housework?","Neulich habe ich das Haus gesaugt und mein Zimmer aufgeräumt. Ich habe geholfen, weil meine Eltern beschäftigt waren."],
["C2 Routine","Warum ist es wichtig, dass junge Menschen zu Hause helfen? Was ist deine Meinung dazu?","Why is it important for young people to help at home? What's your opinion?","Es ist wichtig, dass junge Menschen zu Hause helfen, weil es fair ist. Meiner Meinung nach sollte jeder etwas im Haushalt machen."],
["E2 Hobbies","Welche Hobbys und Interessen hast du?","What hobbies and interests do you have?","Meine Hobbys sind Sport, Videospiele und Musik, weil sie mir Spaß machen. Außerdem treffe ich gerne meine Freunde."],
["E2 Hobbies","Welchen Sport hast du gern als kleines Kind getrieben und warum?","What sport did you like doing as a small child and why?","Als kleines Kind habe ich gerne Fußball gespielt, weil es sehr spannend war. Außerdem habe ich oft mit meinen Freunden gespielt."],
["E2 Hobbies","Warum ist es wichtig, jeden Tag ein bisschen Sport zu machen?","Why is it important to do a bit of sport every day?","Es ist wichtig, jeden Tag Sport zu machen, weil es gesund ist. Außerdem kann Sport Stress reduzieren und Spaß machen."],
["E2 Hobbies","Welche Hobbys oder Sportarten möchtest du gern ausprobieren?","Which hobbies or sports would you like to try?","Ich möchte gerne Tennis ausprobieren, weil es interessant aussieht. Außerdem möchte ich vielleicht schwimmen gehen."],
["E2 Hobbies","Welche Hobbys hat deine Familie?","What hobbies does your family have?","Meine Familie hat verschiedene Hobbys, aber wir mögen alle Sport. Mein Vater spielt gerne Golf, während meine Mutter gerne liest."],
["E2 Hobbies","Haben du und deine Freunde gemeinsame Interessen? Welche?","Do you and your friends have shared interests? Which?","Ja, meine Freunde und ich haben viele gemeinsame Interessen, weil wir alle Sport mögen. Wir spielen gerne Fußball und Videospiele zusammen."],
["E2 Hobbies","Was ist besser, Freizeit zu Hause oder im Freien zu verbringen?","Is it better to spend free time at home or outdoors?","Ich finde Freizeit im Freien besser, weil man aktiv sein kann. Außerdem kann man Zeit mit Freunden verbringen."],
["E2 Hobbies","Ist es wichtig für dich, Freizeit mit Freunden zu verbringen?","Is it important for you to spend free time with friends?","Ja, es ist wichtig für mich, Freizeit mit Freunden zu verbringen, weil es Spaß macht. Außerdem kann ich mit ihnen über meine Probleme sprechen."],
["E5 Food","Wie wichtig sind Essen und Trinken in deinem Leben?","How important are food and drink in your life?","Essen und Trinken sind sehr wichtig in meinem Leben, weil ich Energie brauche. Ich versuche auch, gesund zu essen."],
["E5 Food","Was hast du gestern Abend gegessen?","What did you eat yesterday evening?","Gestern Abend habe ich Pizza mit meiner Familie gegessen, weil sie sehr lecker war. Danach habe ich Wasser getrunken."],
["E5 Food","Warum sind vielleicht manche Leute Vegetarier?","Why might some people be vegetarian?","Manche Leute sind Vegetarier, weil sie keine Tiere essen möchten. Außerdem denken sie, dass eine vegetarische Ernährung gesund sein kann."],
["E5 Food","Hast du einen ausgewogenen Speiseplan?","Do you have a balanced diet?","Ja, ich habe meistens einen ausgewogenen Speiseplan, weil ich viel Obst und Gemüse esse. Ich esse aber auch manchmal Fast Food."],
["E5 Food","Beschreibe deine letzte Familienmahlzeit: Wer hat gekocht, was gab es, wie hat es geschmeckt?","Describe your last family meal: who cooked, what was there, how did it taste?","Meine Mutter hat gestern für meine Familie gekocht, und wir haben Reis mit Hähnchen gegessen. Es hat sehr gut geschmeckt, weil das Essen frisch war."],
["E5 Food","Ist es wichtig, mit der Familie zusammen zu essen?","Is it important to eat together with your family?","Ja, ich finde es wichtig, mit der Familie zusammen zu essen, weil man Zeit zusammen verbringen kann. Außerdem kann man über seinen Tag sprechen."]
].map((r,i)=>({id:i,topic:r[0],q:r[1],en:r[2],a:r[3]}));

const TC={"A2 Holidays":["#38a8ff","#1565c0"],"A5 Traditions":["#ff9a3c","#d9531e"],"B1 School":["#a07bff","#5b2fd1"],"B5 Future":["#2fd6a0","#0e8f6a"],"C1 Home":["#ff6b9a","#c2245a"],"C2 Routine":["#ffc93c","#d98a00"],"E2 Hobbies":["#5ade5a","#239a2f"],"E5 Food":["#ff6a4d","#c42d1c"],"All":["#38a8ff","#1565c0"]};
const tc=(el,t)=>{const c=TC[t]||TC.All;el.style.setProperty("--tc",c[0]);el.style.setProperty("--tc2",c[1])};
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let known=new Set(store.get("gk",[])), topic="All", onlyTodo=false, deck=[], i=0, listMode=false;
const topics=["All",...new Set(D.map(c=>c.topic))];

function build(keepShuffle){
  deck=D.filter(c=>(topic==="All"||c.topic===topic)&&(!onlyTodo||!known.has(c.id)));
  i=Math.min(i,Math.max(deck.length-1,0));
}
function chips(){
  $("chips").innerHTML=topics.map(t=>`<button class="chip${t===topic?" on":""}" data-t="${t}">${t}</button>`).join("");
}
function words(s){return s.split(/(\s+)/).map(w=>/\s/.test(w)?w:`<span class="w">${w}</span>`).join("")}
function render(){
  const tot=D.filter(c=>topic==="All"||c.topic===topic);
  const k=tot.filter(c=>known.has(c.id)).length;
  $("known").textContent=`${k}/${tot.length} ✓`;
  $("prog").style.width=(tot.length?k/tot.length*100:0)+"%";
  $("todo").classList.toggle("on",onlyTodo);
  $("card").classList.remove("flip");
  if(listMode){renderList();return}
  const c=deck[i];
  if(!c){$("count").textContent="0";$("fq").textContent="Alles gelernt! 🎉";$("fen").textContent="All cards in this set are marked as learnt.";$("ftag").textContent=topic;$("ba").textContent="";return}
  $("count").textContent=`${i+1} / ${deck.length}`;
  tc($("card"),c.topic);$("card").classList.remove("pop");void $("card").offsetWidth;$("card").classList.add("pop");
  $("ftag").textContent=$("btag").textContent=c.topic;
  $("fq").textContent=c.q; $("fen").textContent=c.en;
  $("ba").innerHTML=words(c.a); $("bq").textContent=c.q;
  $("mark").textContent=known.has(c.id)?"↺ Unmark":"✓ Got it";
}
function renderList(){
  $("count").textContent=deck.length+" cards";
  $("list").innerHTML=deck.map(c=>`<div class="li" style="--tc:${TC[c.topic][0]};--tc2:${TC[c.topic][1]}"><div class="row"><span class="tag">${c.topic}</span>${known.has(c.id)?'<span class="done">✓</span>':""}</div><h3>${c.q}</h3><div class="en">${c.en}</div><p>${c.a}</p><div style="margin-top:8px;display:flex;gap:8px"><button class="mini" data-say="${c.id}">🔊 Antwort</button><button class="mini" data-sayq="${c.id}">🔊 Frage</button></div></div>`).join("");
}

/* TTS */
let voices=[], voice=null;
function loadVoices(){
  voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  const pref=["Anna","Petra","Markus","Helena","Yannick","Google Deutsch","Katja","Conrad"];
  const saved=store.get("gv",null);
  voices.sort((a,b)=>{const ia=pref.findIndex(p=>a.name.includes(p)),ib=pref.findIndex(p=>b.name.includes(p));return (ia<0?99:ia)-(ib<0?99:ib)});
  $("voice").innerHTML=voices.length?voices.map((v,n)=>`<option value="${n}">${v.name.replace(/\(.*\)/,"").trim()} · ${v.lang}</option>`).join(""):'<option>German voice (default)</option>';
  const si=voices.findIndex(v=>v.name===saved);
  voice=voices[si>=0?si:0]||null; if(si>=0)$("voice").value=si;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,hlEl){
  if(!("speechSynthesis" in window))return alert("Speech not supported on this browser");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="de-DE"; if(voice)u.voice=voice; u.rate=+$("rate").value;
  if(hlEl){
    const ws=[...hlEl.querySelectorAll(".w")], starts=[];let p=0;
    ws.forEach(w=>{p=text.indexOf(w.textContent,p);starts.push(p);p+=w.textContent.length});
    u.onboundary=e=>{ws.forEach(w=>w.classList.remove("hl"));let n=starts.findLastIndex(s=>s<=e.charIndex);if(n>=0)ws[n].classList.add("hl")};
    u.onend=()=>ws.forEach(w=>w.classList.remove("hl"));
  }
  speechSynthesis.speak(u);
}
function sayCurrent(){
  const c=deck[i];if(!c)return;
  if($("card").classList.contains("flip"))speak(c.a,$("ba"));else speak(c.q);
}

/* events */
$("chips").onclick=e=>{const t=e.target.dataset.t;if(!t)return;topic=t;i=0;build();chips();render()};
$("scene").onclick=()=>{if(deck[i])$("card").classList.toggle("flip")};
$("next").onclick=()=>{speechSynthesis?.cancel();i=(i+1)%Math.max(deck.length,1);render()};
$("prev").onclick=()=>{speechSynthesis?.cancel();i=(i-1+deck.length)%Math.max(deck.length,1);render()};
$("say").onclick=sayCurrent;
$("mark").onclick=()=>{const c=deck[i];if(!c)return;known.has(c.id)?known.delete(c.id):known.add(c.id);store.set("gk",[...known]);if(onlyTodo){build()}else if(known.has(c.id)){i=(i+1)%deck.length}render()};
$("shuffle").onclick=()=>{for(let n=deck.length-1;n>0;n--){const r=Math.random()*(n+1)|0;[deck[n],deck[r]]=[deck[r],deck[n]]}i=0;render()};
$("todo").onclick=()=>{onlyTodo=!onlyTodo;i=0;build();render()};
$("listBtn").onclick=()=>{listMode=true;$("list").classList.add("show");$("study").style.display="none";$("list").insertAdjacentHTML("beforebegin","");render();$("list").insertAdjacentHTML("afterbegin",'<button class="btn" id="back">← Back to cards</button>');$("back").onclick=()=>{listMode=false;$("list").classList.remove("show");$("study").style.display="";render()}};
$("list").addEventListener("click",e=>{const a=e.target.dataset.say,q=e.target.dataset.sayq;if(a)speak(D[a].a);if(q)speak(D[q].q)});
$("rate").oninput=e=>{$("rateV").textContent=(+e.target.value).toFixed(2)+"×";store.set("gr",e.target.value)};
$("voice").onchange=e=>{voice=voices[e.target.value]||null;if(voice)store.set("gv",voice.name)};
document.onkeydown=e=>{if(listMode)return;if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("prev").click();else if(e.key===" "){e.preventDefault();$("scene").click()}else if(e.key.toLowerCase()==="s")sayCurrent()};
let tx=0;$("scene").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("scene").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){e.preventDefault();(dx<0?$("next"):$("prev")).click()}});

const r=store.get("gr",null);if(r){$("rate").value=r;$("rateV").textContent=(+r).toFixed(2)+"×"}
chips();build();render();
</script>
</body>
</html>
